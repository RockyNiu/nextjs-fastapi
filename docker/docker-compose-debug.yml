services:
  backend:
    command: ["sh", "-c", "uv add debugpy && uv run python -m debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - 8000:8000
      - 5678:5678
    env_file:
      - ../backend/.env
    environment:
      - DB_HOST=db  # Override for Docker networking
